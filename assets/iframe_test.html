<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kira Iframe Security Smoke Test</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .box { background: #1e293b; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        iframe { width: 100%; height: 120px; border: 1px solid #334155; border-radius: 4px; background: #0f172a; }
    </style>
</head>
<body>
    <h1>Kira Iframe Security Smoke Test</h1>

    <div class="box">
        <h3>Top-Level Invocation Test</h3>
        <button id="top-btn">Invoke greet from Top-Level</button>
        <div id="top-res"></div>
    </div>

    <div class="box">
        <h3>Same-Origin Iframe Invocation Test</h3>
        <iframe id="test-iframe" srcdoc="
            <!DOCTYPE html>
            <html>
            <body style='color:#94a3b8; font-family:sans-serif; padding:10px;'>
                <p>Iframe Content</p>
                <button onclick='window.chrome.webview.postMessage(JSON.stringify({version:1,type:&quot;invoke&quot;,id:&quot;frame-1&quot;,command:&quot;greet&quot;,payload:{name:&quot;Iframe&quot;}}))'>
                    Try invoke from Iframe
                </button>
            </body>
            </html>
        "></iframe>
    </div>

    <script type="module">
        import { invoke } from './kira.js';

        document.getElementById('top-btn').addEventListener('click', async () => {
            try {
                const res = await invoke('greet', { name: 'Top-Level' });
                document.getElementById('top-res').innerText = JSON.stringify(res);
            } catch (err) {
                document.getElementById('top-res').innerText = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
