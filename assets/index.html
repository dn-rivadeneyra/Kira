<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kira Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Kira Framework Example</h1>

        <section class="section">
            <h2>Command: greet</h2>
            <div class="controls">
                <input type="text" id="name-input" value="Alice" />
                <button id="greet-btn">Invoke greet</button>
            </div>
            <pre id="greet-result" class="result"></pre>
        </section>

        <section class="section">
            <h2>Command: unknown_cmd (Error Handling)</h2>
            <div class="controls">
                <button id="unknown-btn">Invoke unknown_cmd</button>
            </div>
            <pre id="unknown-result" class="result"></pre>
        </section>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
